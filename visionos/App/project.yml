# TPVR for Apple Vision Pro: the SwiftUI app around the game framework.
#
# Generated by visionos/scripts/build-visionos.sh, which exports:
#   TPVR_TEAM           Apple developer team ID (signing)
#   TPVR_BUNDLE_ID      bundle identifier (default dev.tpvr.vision.<TEAM>; a bare ID
#                       may already belong to another team, see visionos/README.md)
#   TPVR_GAME_BUILD_DIR the CMake build directory holding DusklightGame.framework
name: TPVRVision
options:
  # visionOS 26, as the guides and the index entry say: Sense controllers, Progressive
  # and the drawable arrays need it, and it's what the port is tested on.
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true

# The launcher every Trevorbilt port shares, vendored here (visionos/scripts/sync-trevorbilt-kit.sh)
# so everything the app runs is in this repository.
packages:
  TrevorbiltKit:
    path: ../TrevorbiltKit

settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: ${TPVR_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TPVRVision:
    type: application
    platform: visionOS
    sources:
      - path: Sources
      # The app icon: three layers drawn by visionos/scripts/make-app-icon.py.
      - path: Assets.xcassets
      # The game window's materials (WindowFrame.usda: the relief and the HUD).
      - path: Resources
        buildPhase: resources
      - path: ../../res
        type: folder
        buildPhase: resources
    # Which commit the app was built from, for its About and Ports tabs: TBBuildCommit (the full
    # commit, "unknown" without git) and TBBuildDirty, a development build: one with uncommitted
    # changes, or from anything but a checkout of the public repository, since only its commits can
    # be compared with what the AVP Ports Index reviewed.
    postBuildScripts:
      # TODO: remove once the AVP Ports Index's live feed carries media (schema 1.4.0). Until then a
      # Debug build bundles the draft feed (DebugFixtures, which never goes into a release) so the
      # Ports tab can show its pictures on a headset; Release builds never have it.
      - name: Ports media fixture (Debug)
        basedOnDependencyAnalysis: false
        script: |
          fixture="$SRCROOT/DebugFixtures/ports-media-fixture.json"
          bundled="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ports-media-fixture.json"
          if [ "$CONFIGURATION" = "Debug" ] && [ -f "$fixture" ]; then cp "$fixture" "$bundled"; else rm -f "$bundled"; fi
      - name: Build commit
        basedOnDependencyAnalysis: false
        # So it runs after Xcode writes the app's Info.plist, not before (which would lose its keys).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          release_repo=edgytoast/tpvr-visionos
          commit=unknown
          dirty=false
          if commit_found=$(git -C "$SRCROOT" rev-parse HEAD 2>/dev/null); then
            commit=$commit_found
            # (Not the submodules' own changes: bootstrap.sh patches aurora in place.)
            git -C "$SRCROOT/../.." diff --quiet --ignore-submodules=dirty HEAD -- 2>/dev/null || dirty=true
            git -C "$SRCROOT" remote -v 2>/dev/null | tr '[:upper:]' '[:lower:]' |
              grep -qF -e "/$release_repo.git " -e "/$release_repo " -e ":$release_repo.git " -e ":$release_repo " || dirty=true
          fi
          /usr/libexec/PlistBuddy -c "Delete :TBBuildCommit" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :TBBuildDirty" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :TBBuildCommit string $commit" -c "Add :TBBuildDirty string $dirty" "$plist"
    info:
      # xcodegen writes Info.plist from these properties (plus the CFBundle defaults).
      path: Info.plist
      properties:
        CFBundleDisplayName: Twilight Princess VR
        # xcodegen otherwise writes its own 1.0 and 1, whatever MARKETING_VERSION says.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.games
        LSRequiresIPhoneOS: true
        GCSupportsControllerUserInteraction: true
        # PS VR2 Sense controllers (SpatialGamepad) stand in for Quest Touch
        # controllers; a Bluetooth gamepad (ExtendedGamepad) works too.
        GCSupportedGameControllers:
          - ProfileName: SpatialGamepad
          - ProfileName: ExtendedGamepad
        NSAccessoryTrackingUsageDescription: Tracks your PlayStation VR2 Sense controllers so the sword and bow follow your hands.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arm64, metal]
        NSHandsTrackingUsageDescription: "Your hands are Link's hands: grip the sword, raise the shield, draw the bow and point at menus."
        NSWorldSensingUsageDescription: The game places Hyrule around you and keeps it steady as you move.
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: GameCube disc image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            # Every compressed format the game's disc reader (nod) opens, so AirDrop and
            # "Open with" offer the app for them.
            LSItemContentTypes: [public.iso-image, dev.tpvr.rvz-image, dev.tpvr.wbfs-image, dev.tpvr.gcz-image, dev.tpvr.ciso-image, dev.tpvr.wia-image]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: dev.tpvr.rvz-image
            UTTypeDescription: Dolphin RVZ disc image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [rvz]
          - UTTypeIdentifier: dev.tpvr.wbfs-image
            UTTypeDescription: Wii Backup File System disc image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wbfs]
          - UTTypeIdentifier: dev.tpvr.gcz-image
            UTTypeDescription: Dolphin GCZ disc image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gcz]
          - UTTypeIdentifier: dev.tpvr.ciso-image
            UTTypeDescription: Compact ISO disc image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ciso]
          - UTTypeIdentifier: dev.tpvr.wia-image
            UTTypeDescription: Wii ISO Archive disc image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wia]
    entitlements:
      # xcodegen writes this file from `properties`, so the entitlements live here.
      path: TPVRVision.entitlements
      properties:
        # Dawn, the game's texture and pipeline caches and an HD texture pack
        # together can pass the default per-app memory limit.
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_NAME: TPVRVision
        PRODUCT_BUNDLE_IDENTIFIER: ${TPVR_BUNDLE_ID}
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TPVRVision-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../src
        FRAMEWORK_SEARCH_PATHS: ${TPVR_GAME_BUILD_DIR}
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        # The build-commit phase reads the repository's git state.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: TrevorbiltKit
      - framework: ${TPVR_GAME_BUILD_DIR}/DusklightGame.framework
        embed: true
        codeSign: true
