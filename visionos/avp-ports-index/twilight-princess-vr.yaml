status_notes: >-
  Plays on Apple Vision Pro (visionOS 27) in full and progressive immersion, with PS VR2 Sense
  controllers or bare hands. Window mode (third person, gamepad) is newer: characters look a little
  flatter than in the game.
visionos_min: "26.0"
