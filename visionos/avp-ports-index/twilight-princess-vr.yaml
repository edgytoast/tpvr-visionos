experiences: [3d-shared-space, 6dof-immersive, 6dof-progressive]
description: >-
  Twilight Princess in first person on Apple Vision Pro: JoeyAW's TPVR mod on Dusklight, built
  natively for visionOS. Full or progressive immersion with PS VR2 Sense controllers or bare hands,
  or the GameCube game in a window beside your apps, with real depth. Bring your own disc.
